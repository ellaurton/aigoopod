    <script>

        
        // Add click event to language icon
        document.getElementById("lang").addEventListener('click', showRandomKoreanFact);


        // Setup button links
        document.getElementById("apple").addEventListener('click', () => {
            window.location.href = "https://music.apple.com/us/new";
        });

        document.getElementById("spotify").addEventListener('click', () => {
            window.location.href = "https://open.spotify.com/";
        });

        document.getElementById("instagram").addEventListener('click', () => {
            window.location.href = "https://instagram.com";
        });


        // Move to a random position within the viewport
        function moveImage(img) {
            const maxX = logoContainer.clientWidth - img.clientWidth;
            const maxY = logoContainer.clientHeight - img.clientHeight;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;
            const rotation = Math.random() * 20 - 10; // random angle between -10° and +10°

            img.dataset.x = x;
            img.dataset.y = y;
            img.dataset.rotation = rotation;
            startRotating(img);

            img.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;
        }


        function startRotating(img) {
            if (img.rotateInterval) return; // Prevent multiple intervals

            let angleOffset = 0;
            const baseRotation = parseFloat(img.dataset.rotation || 0);

            img.rotateInterval = setInterval(() => {
                angleOffset = (angleOffset + 1) % 360;
                const x = img.dataset.x || 0;
                const y = img.dataset.y || 0;
                img.style.transform = `translate(${x}px, ${y}px) rotate(${baseRotation + angleOffset}deg)`;
            }, 30);
        }



        // Initial setup: scatter stamps and add event listeners
        function animateImages() {
            document.querySelectorAll('.stamp').forEach((img, index) => {
                img.style.position = 'absolute';
                img.style.transition = 'transform 1s ease';

                // Set initial position immediately to prevent all stamps appearing at the same spot
                const maxX = logoContainer.clientWidth - img.clientWidth;
                const maxY = logoContainer.clientHeight - img.clientHeight;

                // Calculate initial position - ensure stamps are distributed across the entire container
                // This creates a grid-like distribution but with randomness
                let gridX = index % 6; // Creates up to 6 columns
                let gridY = Math.floor(index / 6); // Creates rows based on index

                // Add randomness to the grid position (±15% variation)
                const randomX = maxX * (gridX / 6) + (Math.random() * 0.3 - 0.15) * maxX;
                const randomY = maxY * (gridY / 6) + (Math.random() * 0.3 - 0.15) * maxY;

                // Make sure we stay within bounds
                const x = Math.max(0, Math.min(maxX, randomX));
                const y = Math.max(0, Math.min(maxY, randomY));

                // Random rotation between -20° and +20°
                const rotation = Math.random() * 40 - 20;

                // Store position data for animation
                img.dataset.x = x;
                img.dataset.y = y;
                img.dataset.rotation = rotation;

                // Apply initial position
                img.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;

                // Start the continuous rotation animation
                startRotating(img);
            });
        }

        function positionStampsWithDelay() {
            // Short delay to ensure everything is rendered
            setTimeout(() => {
                console.log("Positioning stamps now");
                animateImages();
                setupProximityReaction();
            }, 0);
        }
        positionStampsWithDelay(); 

        // Move stamps away when cursor is close
        function setupProximityReaction() {
            document.addEventListener('mousemove', (e) => {
                const cursorX = e.clientX;
                const cursorY = e.clientY;
                const proximity = 120; // Distance in pixels

                document.querySelectorAll('.stamp').forEach(img => {
                    const rect = img.getBoundingClientRect();
                    const imgX = rect.left + rect.width / 2;
                    const imgY = rect.top + rect.height / 2;

                    const dx = cursorX - imgX;
                    const dy = cursorY - imgY;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < proximity) {
                        moveImage(img); // Move if cursor is close
                    }
                });
            });
        }

        const logoContainer = document.querySelector('.top-logo');
    
        const koreanTopics = [
            'Hangul', 'Sejong the Great', 'Joseon', 'Hanbok', 'Korea', 'BTS',
            'Jeju Island', '38th parallel', 'Kimchi', 'Hallyu', 'Pansori', 'K-Pop'
        ];

        async function showRandomKoreanFact() {
            const factDisplay = document.getElementById('factDisplay');
            factDisplay.style.display = 'block';
            factDisplay.innerHTML = 'Loading...';

            const randomTopic = koreanTopics[Math.floor(Math.random() * koreanTopics.length)];

            try {
                const response = await fetch(`https://en.wikipedia.org/w/rest.php/v1/search/page?q=${encodeURIComponent(randomTopic)}&limit=1`);
                const data = await response.json();

                if (data.pages && data.pages.length > 0) {
                    const page = data.pages[0];
                    const title = page.title;
                    const description = page.description || 'No description available.';
                    const url = `https://en.wikipedia.org/wiki/${encodeURIComponent(title)}`;

                    factDisplay.innerHTML = `
  <div id="factBox">
    <button class="close-btn" onclick="document.getElementById('factDisplay').style.display='none'">×</button>
    <strong>${title}</strong><br>
    ${description}<br>
    <a href="${url}" target="_blank">Read more</a>
  </div>
`;
                    factDisplay.style.display = "block"; // make sure it's visible again if previously closed

                } else {
                    factDisplay.innerHTML = 'No fact found. Try again!';
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                factDisplay.innerHTML = 'Failed to load fact. Please try again!';
            }
        }
